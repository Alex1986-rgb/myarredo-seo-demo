<style id="seo-desc-style">
.seo-desc{max-width:1180px;margin:26px auto;padding:0 20px;font-family:'PT Sans','Segoe UI',system-ui,Arial,sans-serif;color:#2a2a2a;}
.seo-desc h2{font-size:26px;line-height:1.22;margin:0 0 14px;color:#1f1f1f;font-weight:700;}
.seo-desc h3{font-size:19px;margin:24px 0 8px;color:#1f7a34;font-weight:700;border-left:3px solid #3aa34a;padding-left:10px;}
.seo-desc p{margin:0 0 12px;font-size:15.5px;line-height:1.7;max-width:82ch;}
.seo-desc ul{margin:0 0 12px 0;padding-left:20px;} .seo-desc li{margin:5px 0;font-size:15.5px;line-height:1.6;}
.seo-desc b{color:#111;}
.seo-desc .adv{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin:6px 0 16px;padding:0;list-style:none;}
.seo-desc .adv li{position:relative;padding-left:26px;font-size:15px;}
.seo-desc .adv li::before{content:"✓";position:absolute;left:0;top:0;color:#3aa34a;font-weight:700;}
.seo-desc .tbl-wrap{overflow-x:auto;margin:10px 0 16px;}
.seo-desc table.data{border-collapse:collapse;width:100%;font-size:14px;min-width:560px;}
.seo-desc table.data th,.seo-desc table.data td{border:1px solid #e3e3e3;padding:9px 12px;text-align:left;vertical-align:top;line-height:1.5;}
.seo-desc table.data th{background:#eef6ef;color:#1f7a34;font-weight:700;}
.seo-desc table.data tr:nth-child(even) td{background:#fbfcfb;}
.seo-desc .note{background:#eef6ef;border:1px solid #bfe0c4;border-radius:8px;padding:10px 14px;font-size:14px;margin:10px 0 16px;}
.seo-desc .links{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 4px;}
.seo-desc .links a{display:inline-block;padding:8px 14px;background:#f4f7f4;border:1px solid #d7e6d9;border-radius:20px;color:#1f7a34;text-decoration:none;font-size:14px;}
.seo-desc .links a:hover{background:#e7f2e9;border-color:#3aa34a;}
.seo-desc .faq-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 4px;}
.seo-desc .faq-card{background:#f7faf7;border:1px solid #e0ece1;border-radius:10px;padding:14px 16px;}
.seo-desc .faq-card .q{display:flex;gap:10px;align-items:flex-start;font-weight:700;color:#1f7a34;font-size:15px;margin-bottom:7px;line-height:1.35;}
.seo-desc .faq-card .q .qi{flex:none;width:22px;height:22px;border-radius:50%;background:#3aa34a;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;}
.seo-desc .faq-card .a{color:#4a4a4a;font-size:14px;line-height:1.55;}
.seo-desc .tags{margin-top:18px;font-size:13px;color:#8a8a8a;}
.seo-rest{position:relative;overflow:hidden;max-height:0;transition:max-height .6s ease;}
.seo-rest.open{max-height:18000px;}
.seo-rest:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff);}
.seo-toggle{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:11px 24px;cursor:pointer;background:#3aa34a;border:1px solid #3aa34a;color:#fff;font-size:15px;font-weight:600;border-radius:6px;font-family:inherit;}
.seo-toggle:hover{background:#2e8b3e;} .seo-toggle .arr{transition:transform .3s;font-size:12px;} .seo-toggle.open .arr{transform:rotate(180deg);}
@media(max-width:720px){.seo-desc .adv,.seo-desc .faq-grid{grid-template-columns:1fr;}}
</style>
